name: Android CI — BudgetTracker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 (required by AGP 8.x) ────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Inject secrets into local.properties ─────────────────────────────────
      # These secrets must be added to GitHub → Settings → Secrets → Actions
      - name: Write local.properties
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"         >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}"   >> local.properties
          echo "AIRTABLE_BASE_ID=${{ secrets.AIRTABLE_BASE_ID }}"   >> local.properties

      # ── Gradle permissions ────────────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Unit tests ────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --no-daemon

      # ── Upload APK artifact ───────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: finwise-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── Upload test results ───────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/